# yaml-language-server: $schema=./quartz/plugins/quartz-plugins.schema.json
configuration:
  pageTitle: Nutriwork Atlas
  pageTitleSuffix: ""
  enableSPA: true
  enablePopovers: false
  analytics: null
  locale: pt-BR
  baseUrl: atlas.gruponutriwork.com.br
  ignorePatterns:
    - private
    - templates
    - .obsidian
  theme:
    fontOrigin: googleFonts
    cdnCaching: true
    typography:
      header: Poppins
      body: Poppins
      code: IBM Plex Mono
    colors:
      lightMode:
        light: "#F4F7FC"
        lightgray: "#E0E8F5"
        gray: "#94A3B8"
        darkgray: "#526277"
        dark: "#07152A"
        secondary: "#0B63F6"
        tertiary: "#29A8FF"
        highlight: rgba(18, 99, 255, 0.12)
        textHighlight: "#8EB9FF66"
      darkMode:
        light: "#010206"
        lightgray: "#1A2D4A"
        gray: "#94A3B8"
        darkgray: "#C8D2E5"
        dark: "#F5F7FF"
        secondary: "#8EB9FF"
        tertiary: "#29A8FF"
        highlight: rgba(18, 99, 255, 0.18)
        textHighlight: "#29A8FF66"

plugins:
  - source: "@nutriwork/atlas-access"
    enabled: true
    options:
      # SHA-256 of the shared development phrase "nutriwork-atlas-dev".
      # This is a client-visible casual privacy gate, not strong authentication.
      passwordHash: 8546caeab1389bb18a5ffd7923802fe181434e69ca868010f83d92c65f7b4cb4
      storageKey: nutriwork-atlas-access
    order: 5
    layout:
      position: beforeBody
      priority: 1
  - source: "@nutriwork/atlas-index-emitter"
    enabled: true
    order: 10
  - source: "@nutriwork/atlas-ui"
    enabled: true
    order: 20
    layout:
      position: afterBody
      priority: 10

  # Only the transformers needed to render the scientific vault remain.
  - source: "@quartz-community/syntax-highlighting"
    enabled: true
    options:
      theme:
        light: github-light
        dark: github-dark
      keepBackground: false
    order: 20
  - source: "@quartz-community/obsidian-flavored-markdown"
    enabled: true
    options:
      comments: true
      highlight: true
      wikilinks: true
      callouts: true
      mermaid: false
      parseTags: true
      parseArrows: true
      parseBlockReferences: true
      enableInHtmlEmbed: false
      enableYouTubeEmbed: true
      enableVideoEmbed: true
      enableCheckbox: true
    order: 30
  - source: "@quartz-community/github-flavored-markdown"
    enabled: true
    order: 40
  - source: "@quartz-community/crawl-links"
    enabled: true
    options:
      markdownLinkResolution: relative
    order: 50
  # Frontmatter parsing is required for note titles and descriptions. The
  # visual properties panel stays disabled because the graph is the product.
  - source: "@quartz-community/note-properties"
    enabled: true
    options:
      includeAll: false
      includedProperties:
        - description
        - tags
        - aliases
      excludedProperties: []
      hidePropertiesView: true
      delimiters: ---
      language: yaml
    order: 55
  - source: "@quartz-community/description"
    enabled: true
    order: 60
  - source: "@quartz-community/latex"
    enabled: true
    options:
      renderEngine: katex
    order: 70
  - source: "@quartz-community/hard-line-breaks"
    enabled: true
    order: 80
  - source: "@quartz-community/remove-draft"
    enabled: true
    order: 100

  # The frame owns the product surface, so Quartz's parallel shells and
  # discovery widgets stay out of the build and out of the DOM.
  - source: "@quartz-community/content-page"
    enabled: true
  - source: "@quartz-community/favicon"
    enabled: true

layout:
  byPageType:
    "404":
      template: atlas
      exclude:
        - "@quartz-community/note-properties"
      positions:
        header: []
        left: []
        right: []
        footer: []
    content:
      template: atlas
      exclude:
        - "@quartz-community/note-properties"
      positions:
        header: []
        left: []
        right: []
        footer: []
